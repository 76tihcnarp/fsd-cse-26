<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html</title>
    <style>
        table{
            width:80vw;
            margin:auto;
            border:2px purple solid
        }
        </style>
</head>
<body>
  <center><h2>table of contents</h2></center>
    
    <table>
        <thead>
            <th>s.no</th>
            <th>title</th>
             <th>images</th>
            <th>category</th>
            <th>rating</th>
            <th>price</th>
            <th>stock</th>
            <th>action</th>
        </thead>
        <tbody id="data">
        </tbody>
        
    </table>

    <script>
    async function getRate() {
        const url = "https://open.er-api.com/v6/latest/USD";

        try {
            const res = await fetch(url);
            const rd = await res.json();

            console.log(rd.rates.INR);

            return rd.rates.INR;
        }
        catch (err) {
            console.log(err);
        }
    }


    async function getProducts() {

        const url = "https://dummyjson.com/products?limit=10&skip=5";

        try {

            const rate = await getRate();

            const res = await fetch(url);
            console.log("res:", res);

            const data = await res.json();
            console.log("data:", data.products);
            let rows = "";

            data.products.map((i, index) => (

                rows = rows + `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${i.title}</td>
                        <td> <img  src="${i.images[0]}" height="50px" width="50px"></td>
                        <td>${i.category}</td>
                        <td>${i.rating}</td>
                        <td> ₹${(i.price * rate).toFixed(2)}</td>
                        <td>${i.stock}</td>
                        <td><button>Add to Cart</button></td>
                    </tr>
                `
            ));


            const el = document.getElementById("data");
            el.innerHTML = rows;

        }
        catch (err) {
            console.log("error:", err);
        }
    }

    getProducts();

</script></body>
</html>
